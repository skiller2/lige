<nz-select
  [ngModel]="selected()"
  (ngModelChange)="modelChange($event)"
  (blur)="onBlur()"
  [nzDisabled]="controlDisabled()"
  [ngModelOptions]="{ standalone: true }"
  nzAllowClear
  nzShowSearch
  [nzPlaceHolder]="placeholder()"
  [nzDropdownMatchSelectWidth]="false"
  style="width: 100%;">
  @for (valor of opciones(); track valor.ValorId) {
    <nz-option [nzLabel]="valor.ValorDescripcion" [nzValue]="valor.ValorId"></nz-option>
  }
</nz-select>
