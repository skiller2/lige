<nz-card class="small-margin">
  <ng-container>
    @if (columns().length) {
      <div nz-tab>
        <shared-filtro-builder [fieldsToSelect]="columns()" [startFilters]="startFilters()"
          [(options)]="listOptions" />
        <div class="gridContainerOrd container-fluid">
          <angular-slickgrid gridId="gridEditOrd" class="" [columns]="columns()"
            [options]="gridOptions" [dataset]="gridData.value()"
            (onAngularGridCreated)="angularGridReady($event)"
            (onBeforeEditCell)="handleOnBeforeEditCell($event)"
            (onSelectedRowsChanged)="handleSelectedRowsChanged($event)">
          </angular-slickgrid>
        </div>
      </div>
    }
  </ng-container>
</nz-card>
