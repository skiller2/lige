<nz-card class="small-margin">
  <br>
  <div nz-row class="contentStyle">
    <div nz-col nzSpan="13" class="listStyle">
      <ul nz-menu nzMode="horizontal" style="display: flex;">
        <li nz-menu-item nzMatchRouter>
          <span nz-icon nzType=""></span>
          <a [routerLink]="['/', 'ges', 'inaes','altas-bajas']" >Altas y Bajas</a>
        </li>
        <li nz-menu-item nzMatchRouter>
          <span nz-icon nzType=""></span>
          <a [routerLink]="['/', 'ges', 'inaes','recibos']">Recibos</a>
        </li>
      </ul>
    </div>
  
  </div>

  <nz-tabs nzCentered nzLinkRouter class="hide-ant-tabs-nav" [(nzSelectedIndex)]="tabIndex">
    <nz-tab></nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/inaes/altas-bajas">Altas y Bajas</a>
      <ng-template nz-tab>
        @if (columns().length) {
          <div nz-row style="align-items: center; display: flex; justify-content: space-between;">
            <div style="flex: 1;">
              <shared-filtro-builder [fieldsToSelect]="columns()" [startFilters]="startFilters()" [(options)]="listOptions"  />
            </div>
            <div style="flex-shrink: 0;">
              <nz-button-group nz-button nz-buttonGroup style="align-items: flex-end;">
                <!-- Recarga -->
                <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.icon.reload' | i18n }}"
                (click)="gridData.reload()">
                  <span nz-icon nzType="reload" nzTheme="outline"></span>
                </button>
                <!-- Descarga Altas res 1000/21 -->
                <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.btn.export.altas.res1000-21' | i18n }}"
                (click)="exportXlsxGrid('altas1000-21')" [nzLoading]="loadingExport()" [disabled]="loadingExport()">
                  <span nz-icon nzType="file" nzTheme="outline"></span>
                </button>
                <!-- Descarga Baja res 1000/21 -->
                <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.btn.export.bajas.res1000-21' | i18n }}"
                (click)="exportXlsxGrid('bajas1000-21')" [nzLoading]="loadingExport()" [disabled]="loadingExport()">
                  <span nz-icon nzType="file" nzTheme="outline"></span>
                </button>
                <!-- Descarga Altas res 756/2025 -->
                <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.btn.export.altas.res756-2025' | i18n }}"
                (click)="exportCsvGrid('altas756-2025')" [nzLoading]="loadingExport()" [disabled]="loadingExport()">
                  <span nz-icon nzType="file" nzTheme="outline"></span>
                </button>
                <!-- Descarga Baja res 756/2025 -->
                <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.btn.export.bajas.res756-2025' | i18n }}"
                (click)="exportCsvGrid('bajas756-2025')" [nzLoading]="loadingExport()" [disabled]="loadingExport()">
                  <span nz-icon nzType="file" nzTheme="outline"></span>
                </button>
              </nz-button-group>
            </div>
          </div>
          <div class="gridContainer container-fluid">
            <angular-slickgrid gridId="gridINAES" class="" [columns]="columns() | colsFilter"
              [options]="gridOptions" [dataset]="gridData.value()"
              (onAngularGridCreated)="angularGridReady($event)">
            </angular-slickgrid>
          </div>
        }
      </ng-template>
    </nz-tab>

    <nz-tab>
      <a nz-tab-link routerLink="/ges/inaes/recibos">Recibos</a>
      <ng-template nz-tab>
        @defer (when tabIndex() == 2){
        <app-table-inaes-recibos></app-table-inaes-recibos> 
        }
      </ng-template>
    </nz-tab>

  </nz-tabs>
</nz-card>
