<nz-card class="small-margin">
  <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-control>
        <!-- <nz-date-picker nzMode="month" [(ngModel)]="periodo" /> -->
      </nz-form-control>
    </div>

    <div nz-col nzSpan="12" style="display: flex;flex-direction: row-reverse;">
      <nz-button-group nz-button nzButtonGroup style="text-align: right;">
        <!-- <button nz-button nzType="default" (click)="openDrawerforEdit()" [disabled]="!(PersonalLicenciaId>0)" ><span nz-icon nzType="edit"
                nzTheme="outline" ></span></button> -->
      </nz-button-group>
    </div>
  </div>

  <div nz-row class="contentStyle">
    <div nz-col nzSpan="13" class="listStyle">
      <ul nz-menu nzMode="horizontal" style="display: flex;">
        <li nz-menu-item nzMatchRouter>
          <span nz-icon nzType=""></span>
          <a [routerLink]="['/', 'ges', 'inaes','altas-bajas']" >Altas y Bajas</a>
        </li>
        <li nz-menu-item nzMatchRouter>
          <span nz-icon nzType=""></span>
          <a [routerLink]="['/', 'ges', 'inaes','recibos']">Recibos</a>
        </li>
      </ul>
    </div>
  
  </div>

  <nz-tabs nzCentered nzLinkRouter class="hide-ant-tabs-nav">
    <nz-tab></nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/inaes/altas-bajas">Altas y Bajas</a>
      <ng-template nz-tab>
        @if (columns().length) {
          <div nz-row nzJustify="space-between" nzAlign="middle">
            <shared-filtro-builder [fieldsToSelect]="columns()" [startFilters]="startFilters()" [(options)]="listOptions" />
            <!-- <div nz-col nzFlex="400px">
              <nz-form-item>
                <nz-form-label [nzSpan]="5" class="inputText">Archivo</nz-form-label>
                <nz-form-control [nzSpan]="19">
                  <app-file-upload [(ngModel)]="files" [idForSearh]="0" [cantMaxFiles]="1" [textForSearch]="'PRU'"
                    [columnForSearch]="'DocumentoId'" [tableForSearch]="'documento'" [showTipoDocs]="false"></app-file-upload>
                </nz-form-control>
              </nz-form-item>
            </div> -->
            <div nz-col style="display: flex;">
              <nz-button-group nz-button nz-buttonGroup style="align-items: flex-end;">
                <!-- Descarga Alta -->
                <!-- <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.icon.add' | i18n }}" >
                  <span nz-icon nzType="plus" nzTheme="outline"></span>
                </button> -->
                <!-- Descarga Baja -->
                <!-- <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.icon.edit' | i18n }}" >
                  <span nz-icon nzType="edit" nzTheme="outline"></span>
                </button> -->
              </nz-button-group>
            </div>
          </div>
          <div class="gridContainer container-fluid">
            <angular-slickgrid gridId="gridINAES" class="" [columns]="columns() | colsFilter"
              [options]="gridOptions" [dataset]="gridData.value()"
              (onAngularGridCreated)="angularGridReady($event)">
            </angular-slickgrid>
          </div>
        }
      </ng-template>
    </nz-tab>

    <nz-tab>
      <a nz-tab-link routerLink="/ges/inaes/recibos">Recibos</a>
      <ng-template nz-tab>
      </ng-template>
    </nz-tab>

  </nz-tabs>
</nz-card>
