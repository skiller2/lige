<nz-card class="small-margin">
  <ng-container>
      @if(columns().length) {
        <shared-filtro-builder #thd [fieldsToSelect]="columns()" [startFilters]="startFilters()"
          [(options)]="listOptions"/>
        <div class="gridDescargasContainer container-fluid">
          <angular-slickgrid gridId="gridDescargas" [columns]="columns()" [options]="gridDetalleOptions"
            [dataset]="gridData.value()" (onAngularGridCreated)="angularGridReady($event)">
          </angular-slickgrid>
        </div>
      }
    </ng-container>
  </nz-card>
