<nz-card #tabestudio class="small-margin">
    <ng-container>
      @if(columns().length) {
        <shared-filtro-builder [fieldsToSelect]="columns()" [(options)]="listOptions" />
        <div class="gridContainerAdministradoresClientes container-fluid">
          <angular-slickgrid 
            gridId="gridAdministradoresClientes" 
            [columns]="columns()"
            [options]="gridOptions" 
            [dataset]="gridData.value()"
            (onAngularGridCreated)="angularGridReady($event)">
          </angular-slickgrid>
        </div>
      }
    </ng-container>
  </nz-card>
