<nz-modal [nzVisible]="isVisible()" (nzOnCancel)="isVisible.set(false)" nzTitle="Descarga Monotributos">

    <div *nzModalContent>
        <nz-select [(ngModel)]="selectedOption" nzPlaceHolder="Selecciona una opción"
            [nzDropdownMatchSelectWidth]="false">
            <nz-option [nzLabel]="'Todos'" nzValue="T"></nz-option>
            <nz-option [nzLabel]="'Cliente'" nzValue="C"></nz-option>
            <nz-option [nzLabel]="'Sucursal'" nzValue="S"></nz-option>
            <nz-option [nzLabel]="'Persona'" nzValue="P"></nz-option>
            <nz-option [nzLabel]="'Grupo'" nzValue="G"></nz-option>
        </nz-select>
        @switch (selectedOption()) {
        @case ("C") {
        <app-cliente-search [(ngModel)]="ClienteIdWithSearch"></app-cliente-search>
        }
        @case ("P") {
        <app-personal-search [(ngModel)]="PersonalIdWithSearch" [anio]="anio()" [mes]="mes()"></app-personal-search>
        }
        @case ("S") {
        <nz-select nzAllowClear style="width:100%" nzPlaceHolder="Sucursal" nzShowSearch
            [nzDropdownMatchSelectWidth]="false" [(ngModel)]="SucursalIdWithSearch">
            @for (option of $optionsSucursales | async; track option.SucursalId) {
            <nz-option [nzValue]="option.SucursalId" [nzLabel]="option.SucursalDescripcion"></nz-option>
            }
        </nz-select>
        }
        @case ("G") {
        <app-grupo-actividad-search [(ngModel)]="GrupoIdWithSearch"
            (valueExtendedChange)="onGrupoChange($event)"></app-grupo-actividad-search>
        }
        }
    </div>
    <div *nzModalFooter style="text-align: right;">
        <a nz-button nzType="primary" app-down-file [httpMethod]="'POST'" [httpBody]="buildBody()"
            httpUrl="api/impuestos_afip/download/comprobantes_filtrados/" notificationMsg="Generando PDF de Monotributos"
            (click)="isVisible.set(false)">Aceptar</a>
    </div>
</nz-modal>
