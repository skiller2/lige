<nz-card #tabPoliza class="small-margin">
    <ng-container>
      @if(columns().length) {
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <div style="width: 70%;">
            <shared-filtro-builder  [fieldsToSelect]="columns()" [(options)]="listOptions" /> 
          </div>
          <nz-button-group nz-button nzButtonGroup>
            <!-- btn  reload -->
            <button nz-button nzType="default" (click)="gridData.reload()"
            nz-tooltip nzTooltipTitle="{{ 'app.icon.reload' | i18n }}"><span nz-icon nzType="reload" nzTheme="outline"></span></button>
            <!-- btn  drawer -->
            <button nz-button nzType="default" (click)="openDrawerForNew()" nz-tooltip
            nzTooltipTitle="{{ 'app.icon.add' | i18n }}"><span nz-icon nzType="plus" nzTheme="outline"></span></button>
            <button nz-button nzType="default" [disabled]="!selectedPoliza()" (click)="openDrawerforEdit()" nz-tooltip
            nzTooltipTitle="{{ 'app.icon.edit' | i18n }}"><span nz-icon nzType="edit" nzTheme="outline"></span></button>
            <button nz-button nzType="default" [disabled]="!selectedPoliza()" (click)="openDrawerForConsult()" nz-tooltip
            nzTooltipTitle="{{ 'app.detail' | i18n }}"><span nz-icon nzType="info-circle" nzTheme="outline"></span></button>
            <button nz-button nzType="default" [disabled]="!selectedPoliza()" [nzLoading]="isDeleting()"
            nz-popconfirm
            nzPopconfirmTitle="¿Eliminar la póliza {{ selectedPoliza()?.PolizaSeguroNroPoliza }} - {{ selectedPoliza()?.PolizaSeguroNroEndoso }}? Se eliminarán también el personal asociado y el documento cargado."
            nzPopconfirmPlacement="bottomRight"
            nzOkText="Eliminar" nzOkDanger nzCancelText="Cancelar"
            (nzOnConfirm)="deletePoliza()" nz-tooltip
            nzTooltipTitle="{{ 'app.icon.delete' | i18n }}"><span nz-icon nzType="delete" nzTheme="outline"></span></button>
          </nz-button-group>
        </div>
      
        <div class="gridContainerPoliza container-fluid">
          <angular-slickgrid 
            gridId="gridPoliza" 
            [columns]="columns()"
            [options]="gridOptions" 
            [dataset]="gridData.value()"
            (onAngularGridCreated)="angularGridReady($event)"
            (onSelectedRowsChanged)="handleSelectedRowsChanged($event)">
          </angular-slickgrid>
        </div>
      }
    </ng-container>

    <app-poliza-seguro-drawer (onRefreshPolizaSeguro)="onRefreshPolizaSeguro()" [(visible)]="visible"  
    [PolizaSeguroNroPoliza]="PolizaSeguroNroPoliza()" 
    [PolizaSeguroNroEndoso]="PolizaSeguroNroEndoso()" 
    [CompaniaSeguroId]="CompaniaSeguroId()" 
    [TipoSeguroCodigo]="TipoSeguroCodigo()" 
    [openDrawerConsult]="openDrawerConsult()"></app-poliza-seguro-drawer> 
  </nz-card>
