<nz-card class="small-margin">

  <div nz-row style="align-items: center; display: flex; justify-content: space-between;">
    <div nz-row nzSpan="12">
      <nz-form-label [nzSpan]="10">Periodo</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <nz-date-picker nzMode="month" [(ngModel)]="periodo" nzFormat="MM/yyyy" style="width: 100%;"/>
      </nz-form-control>
    </div>

    <ul nz-menu nzMode="horizontal">
      <li nz-menu-item nzMatchRouter>
        <span nz-icon nzType=""></span>
        <a [routerLink]="['/', 'ges', 'cust', 'objetivos']" >Objetivos</a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <span nz-icon nzType=""></span>
        <a [routerLink]="['/', 'ges', 'cust', 'detalle']" (click)="abrirCustodia()">Detalle</a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <span nz-icon nzType=""></span>
        <a [routerLink]="['/', 'ges', 'cust', 'detallepersonal']" >Detalle del Personal</a>
      </li>
    </ul>

    <nz-button-group nz-button nzButtonGroup>
      <button nz-button nzType="default" [disabled]="editCustodiaId()? false : true"
        [routerLink]="['/', 'ges', 'cust','editar']" (click)="abrirCustodia()"  nz-tooltip nzTooltipTitle="{{ 'app.icon.edit' | i18n }}"><span nz-icon nzType="edit"
      nzTheme="outline"></span></button>
      <button nz-button nzType="default"
        [routerLink]="['/', 'ges', 'cust','alta']" nz-tooltip nzTooltipTitle="{{ 'app.icon.add' | i18n }}"><span nz-icon nzType="plus" nzTheme="outline"></span></button>
      <button nz-button nzType="default" [disabled]="rows.length? false : true" (click)="visible.set(true)" nz-tooltip nzTooltipTitle="{{ 'app.icon.editmasivo' | i18n }}"><span
        nz-icon nzType="copy" nzTheme="outline"></span></button>
      <button nz-button nzType="default" (click)="refreshGridNow()"><span nz-icon
          nzType="reload" nzTheme="outline" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.reload' | i18n }}"></span></button>

      </nz-button-group>
    </div>

    <nz-tabs nzCentered nzLinkRouter class="hide-ant-tabs-nav">
      <nz-tab></nz-tab>
      <nz-tab>
        <a nz-tab-link routerLink="/ges/cust/objetivos">Custodias</a>

        @if (columns().length) {
          <ng-template nz-tab>
            <shared-filtro-builder [fieldsToSelect]="columns()"   [(options)]="listOptions" [startFilters]="startFilters()" />
            <div class="gridListContainer container-fluid">
              <angular-slickgrid gridId="grid" [columns]="columns()" [options]="gridOptions"
                [dataset]="gridDataSet.value()" (onAngularGridCreated)="angularGridReady($event.detail)"
                (onSelectedRowsChanged)="handleSelectedRowsChanged($event)">
              </angular-slickgrid>
            </div>
          </ng-template>
        }
      </nz-tab>

      <nz-tab>
        <a nz-tab-link routerLink="/ges/cust/detalle">Detalle</a>
        <ng-template nz-tab>
          <!-- El @if recrea el form en cada entrada: no arrastra datos de la vez anterior -->
          @if (tab() == 'detalle' && custodiaAbierta()) {
            <app-custodias-form [CustodiaCodigo]="custodiaAbierta()" [soloLectura]="true" [anio]="anio()" [mes]="mes()" />
          }
        </ng-template>
      </nz-tab>

      <nz-tab>
        <a nz-tab-link routerLink="/ges/cust/alta">Alta</a>
        <ng-template nz-tab>
          @if (tab() == 'alta') {
            <app-custodias-form [CustodiaCodigo]="0" [soloLectura]="false" [anio]="anio()" [mes]="mes()" (custodiaGuardada)="refreshGridNow()" />
          }
        </ng-template>
      </nz-tab>

      <nz-tab>
        <a nz-tab-link routerLink="/ges/cust/editar">Editar</a>
        <ng-template nz-tab>
          @if (tab() == 'editar' && custodiaAbierta()) {
            <app-custodias-form [CustodiaCodigo]="custodiaAbierta()" [soloLectura]="!custodiaEditable()" [anio]="anio()" [mes]="mes()" (custodiaGuardada)="refreshGridNow()" />
          }
        </ng-template>
      </nz-tab>

      <nz-tab>
        <a nz-tab-link routerLink="/ges/cust/detallepersonal">Detalle del Personal</a>
        <ng-template nz-tab>
          <app-custodias-personal-detalle [periodo]="periodo()"></app-custodias-personal-detalle>
        </ng-template>
      </nz-tab>

    </nz-tabs>
  </nz-card>
  <app-custodias-estado-masivo-drawer [custodias]="custodiasSeleccionadas()" [anio]="anio()" [mes]="mes()" [(visible)]="visible"
    (estadoMasivoGuardado)="refreshGridNow()" />
