<nz-card class="small-margin">

  <div nz-row style="display: flex; align-items: center;">

    <div style="flex: 1;"></div>

    <!-- Con el detalle abierto, la solapa es la vuelta al listado -->
    <ul nz-menu nzMode="horizontal" style="display: flex;">
      <li nz-menu-item [nzSelected]="!ordenAbierta()" (click)="volverAlListado()">
        <a>Listado</a>
      </li>
    </ul>

    <div style="flex: 1; display: flex; justify-content: flex-end;">
      <nz-button-group nz-button nzButtonGroup>
        <!-- btn alta -->
        <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.icon.add' | i18n }}"
          (click)="altaOrdenVenta()">
          <span nz-icon nzType="plus" nzTheme="outline"></span></button>
        <!-- btn baja -->
        <button nz-button nzType="default" [disabled]="sinSeleccion()" nz-popconfirm
          nzPopconfirmTitle="Está seguro que quiere eliminar esta Orden de Venta?"
          (nzOnConfirm)="bajaOrdenVenta()" nz-tooltip nzTooltipTitle="{{ 'app.icon.delete' | i18n }}">
          <span nz-icon nzType="delete" nzTheme="outline"></span></button>
        <!-- btn modificar -->
        <button nz-button nzType="default" [disabled]="sinSeleccion()" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.edit' | i18n }}" (click)="modificarOrdenVenta()">
          <span nz-icon nzType="edit" nzTheme="outline"></span></button>
        <!-- btn consulta -->
        <button nz-button nzType="default" [disabled]="sinSeleccion()" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.consult' | i18n }}" (click)="consultaOrdenVenta()">
          <span nz-icon nzType="info-circle" nzTheme="outline"></span></button>
      </nz-button-group>
    </div>

  </div>

  <!-- La grilla no se destruye al abrir el detalle: queda oculta para no perder filtros ni selección -->
  <div [hidden]="ordenAbierta()">
    <app-table-orden-venta [(ordenesSeleccionadas)]="ordenesSeleccionadas" [refreshGrid]="refreshTick()" />
  </div>

  @if (ordenAbierta()) {

  <!-- Período y objetivo de la orden: la identifican y no se editan desde el detalle -->
  <nz-form-item style="margin-top: 20px;">
    <nz-form-label [nzXs]="24" [nzSm]="24" [nzMd]="3">Período</nz-form-label>
    <nz-form-control [nzXs]="24" [nzSm]="24" [nzMd]="4">
      <input nz-input [value]="periodoTexto()" readonly />
    </nz-form-control>

    <nz-form-label [nzXs]="24" [nzSm]="24" [nzMd]="3">Objetivo</nz-form-label>
    <nz-form-control [nzXs]="24" [nzSm]="24" [nzMd]="10">
      <app-objetivo-search [ngModel]="objetivoId()" [ngModelOptions]="{ standalone: true }" [disabled]="true" />
    </nz-form-control>
  </nz-form-item>

  <app-orden-venta-form #ordenVentaForm [anio]="anio()" [mes]="mes()" [objetivoId]="objetivoId()" [items]="items()"
    [clienteId]="clienteId()" [clienteElementoDependienteId]="clienteElementoDependienteId()"
    [soloLectura]="soloLectura()" (detalleChange)="detalle.set($event)" (guardado)="ordenVentaGuardada()" />

  <nz-divider></nz-divider>

  <div style="display: flex; align-items: flex-end; gap: 16px; margin-bottom: 60px;">
    <div style="flex: 1;"></div>

    <!-- En consulta no hay nada para guardar -->
    @if (!soloLectura()) {
    <button nz-button nzType="primary" (click)="ordenVentaForm.save()" [nzLoading]="ordenVentaForm.guardando()"
      [disabled]="!ordenVentaForm.conCambios() || ordenVentaForm.guardando()">
      {{ 'app.btn.save' | i18n }}
    </button>
    }

    <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px;">
      <label>Total Orden de Venta</label>
      <input nz-input [value]="importeTotal() | currency" readonly style="width: 160px; text-align: right;" />
    </div>
  </div>
  }

</nz-card>
