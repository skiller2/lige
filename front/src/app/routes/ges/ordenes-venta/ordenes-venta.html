<nz-card class="small-margin">
  <ng-template #extraTemplate>
      <nz-button-group nz-button nzButtonGroup>
        <!-- btn recarga: vuelve a leer la lista con los filtros aplicados -->
        <button nz-button nzType="default" (click)="refreshTick.update(n => n + 1)" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.reload' | i18n }}">
          <span nz-icon nzType="reload" nzTheme="outline"></span></button>
        <!-- btn alta: el routerLink va en el botón, envolverlo en un <a> lo saca del button-group -->
        <button nz-button nzType="default" [routerLink]="['/', 'ges', 'ordenes-venta', 'alta']" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.add' | i18n }}" >
          <span nz-icon nzType="plus" nzTheme="outline"></span></button>
        <!-- btn baja: la confirmación la abre la solapa, no el click -->
        <button nz-button nzType="default" [disabled]="!ordenesSeleccionadas() || ordenesSeleccionadas().length ==0"
          nz-popconfirm nzPopconfirmTitle="Está seguro que quiere anular esta Orden de Venta?"
          (nzOnConfirm)="bajaOrdenVenta()" nz-tooltip nzTooltipTitle="Anular">
          <span nz-icon nzType="delete" nzTheme="outline"></span></button>
        <!-- btn modificar: abre una orden, así que no vale con varias tildadas -->
        <button nz-button nzType="default" [disabled]="!ordenesSeleccionadas() || ordenesSeleccionadas().length !=1"
          nz-tooltip nzTooltipTitle="{{ 'app.icon.edit' | i18n }}" [routerLink]="['/', 'ges', 'ordenes-venta', 'editar']">
          <span nz-icon nzType="edit" nzTheme="outline"></span></button>
        <!-- btn consulta -->
        <button nz-button nzType="default" [disabled]="!ordenesSeleccionadas() || ordenesSeleccionadas().length !=1"
          nz-tooltip nzTooltipTitle="{{ 'app.icon.consult' | i18n }}" [routerLink]="['/', 'ges', 'ordenes-venta', 'detalle']">
          <span nz-icon nzType="info-circle" nzTheme="outline"></span></button>
        <!-- btn edición masiva: trabaja sobre todas las órdenes seleccionadas -->
        <button nz-button nzType="default" [disabled]="!ordenesSeleccionadas() || ordenesSeleccionadas().length ==0"
          nz-tooltip nzTooltipTitle="Edición masiva" (click)="edicionMasiva()">
          <span nz-icon nzType="profile" nzTheme="outline"></span></button>
      </nz-button-group>
  </ng-template>

  <nz-tabs nzLinkRouter [nzTabBarExtraContent]="extraTemplate">
    <nz-tab><a *nzTabLink nz-tab-link [routerLink]="['/', 'ges', 'ordenes-venta', 'listado']">Listado</a>
      <app-table-orden-venta [(ordenesSeleccionadas)]="ordenesSeleccionadas" [refreshGrid]="refreshTick()" />
    </nz-tab>

    <nz-tab [nzDisabled]="!router.isActive('/ges/ordenes-venta/detalle',{})" >
      <a *nzTabLink nz-tab-link [routerLink]="['/', 'ges', 'ordenes-venta', 'detalle']" >Detalle</a>
      @if (router.isActive('/ges/ordenes-venta/detalle',{})){
      <app-orden-venta-form [soloLectura]="true" [origenCrud]="true"
        [NroOrdenVenta]="this.ordenesSeleccionadas()?.[0] ?? 0" />
      }
    </nz-tab>

    <nz-tab [nzDisabled]="!router.isActive('/ges/ordenes-venta/alta',{})"><a *nzTabLink nz-tab-link [routerLink]="['/', 'ges', 'ordenes-venta', 'alta']">Alta</a>
      <app-orden-venta-form [soloLectura]="false" [origenCrud]="true" [NroOrdenVenta]="0"
        (ordenVentaGuardada)="ordenVentaGuardada()" />
    </nz-tab>

    <nz-tab [nzDisabled]="!router.isActive('/ges/ordenes-venta/editar',{})"><a *nzTabLink nz-tab-link [routerLink]="['/', 'ges', 'ordenes-venta', 'editar']">Editar</a>
      @if (router.isActive('/ges/ordenes-venta/editar',{})){

      <app-orden-venta-form [soloLectura]="false" [origenCrud]="true"
        [NroOrdenVenta]="this.ordenesSeleccionadas()?.[0] ?? 0" (ordenVentaGuardada)="ordenVentaGuardada()" />
      }
    </nz-tab>

  </nz-tabs>

</nz-card>
<app-orden-venta-masiva-drawer [ordenes]="ordenesSeleccionadas()" [visible]="masivaVisible()"
   (guardado)="refreshTick.update(n => n + 1)" />
