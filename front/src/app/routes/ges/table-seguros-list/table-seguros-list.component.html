<nz-card class="small-margin">
  <ng-container>
    @if (columns().length) {
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="width: 80%;">
          <shared-filtro-builder [fieldsToSelect]="columns()" [startFilters]="startFilters()"
            [(options)]="listOptions" /> 
        </div>
        <nz-button-group nz-button nzButtonGroup>
          <!-- btn  reload -->
          <button nz-button nzType="default" (click)="gridData.reload()"
          nz-tooltip nzTooltipTitle="{{ 'app.icon.reload' | i18n }}"><span nz-icon nzType="reload" nzTheme="outline"></span></button>
        </nz-button-group>
      </div>
      <div class="gridContainer1 container-fluid">
        <angular-slickgrid gridId="gridEdit1" class="" [columns]="columns()"
          [options]="gridOptions" [dataset]="gridData.value()"
          (onAngularGridCreated)="angularGridReady($event)">
        </angular-slickgrid>
      </div>
    }
  </ng-container>
</nz-card>
