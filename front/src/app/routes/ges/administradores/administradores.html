<nz-card class="small-margin">
  <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-control>
      
      </nz-form-control>
    </div>
    <div nz-col nzSpan="12" style="display: flex;flex-direction: row-reverse;">
      <nz-button-group nz-button nzButtonGroup style="text-align: right;">
        <!-- btn  reload -->
        <button nz-button nzType="default" (click)="refreshGrid()" nz-tooltip nzTooltipTitle="{{ 'app.icon.reload' | i18n }}">
          <span nz-icon nzType="reload" nzTheme="outline"></span>
        </button>
        <!-- btn  add -->
        <button nz-button nzType="default" [routerLink]="['/', 'ges', 'administradores','carga']" nz-tooltip nzTooltipTitle="{{ 'app.icon.add' | i18n }}">
          <span nz-icon nzType="plus" nzTheme="outline"></span>
        </button>
        <!-- btn  modify -->
        <button nz-button nzType="default" [routerLink]="['/', 'ges', 'administradores','editar']" nz-tooltip nzTooltipTitle="{{ 'app.icon.edit' | i18n }}"
          [disabled]="administradorId() == 0">
          <span nz-icon nzType="edit" nzTheme="outline"></span>
        </button>
        <!-- btn  detail -->
        <button nz-button nzType="default" [routerLink]="['/', 'ges', 'administradores','detalle']" nz-tooltip nzTooltipTitle="{{ 'app.icon.consult' | i18n }}"
          [disabled]="administradorId() == 0">
          <span nz-icon nzType="info-circle" nzTheme="outline"></span>
        </button>
        <!-- btn  history -->
        <!-- <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.icon.history' | i18n }}">
          <span nz-icon nzType="menu-unfold" nzTheme="outline"></span>
        </button> -->
        <!-- btn  delete -->
        <button nz-button nzType="default" nz-tooltip nzTooltipTitle="{{ 'app.icon.delete' | i18n }}"
          nz-popconfirm nzPopconfirmTitle="¿Confirmar eliminación de registro?" (nzOnConfirm)="deleteItem()"
          [nzLoading]="loadingD()" [disabled]="administradorId() == 0">
          <span nz-icon nzType="delete" nzTheme="outline"></span>
        </button>
      </nz-button-group>

    </div>

  </div>
  <div nz-row class="contentStyle">
    <div nz-col nzSpan="13" class="listStyle">
      <ul nz-menu nzMode="horizontal" style="display: flex;">
        <li nz-menu-item nzMatchRouter>
          <span nz-icon nzType=""></span>
          <a [routerLink]="['/', 'ges', 'administradores','listado']">Listado</a>
        </li>
        <li nz-menu-item nzMatchRouter>
          <span nz-icon nzType=""></span>
          <a [routerLink]="['/', 'ges', 'administradores','clientes']" >Clientes</a>
        </li>
      </ul>
    </div>
  
  </div>
  <nz-tabs nzCentered nzLinkRouter class="hide-ant-tabs-nav" [(nzSelectedIndex)]="tabIndex" (nzSelectChange)="onTabsetChange($event)">
    <nz-tab></nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/administradores/listado">Listado</a>
      <ng-template nz-tab>

        <app-administradores-listado-table #adminsTable [(administradorId)]="administradorId"></app-administradores-listado-table>

      </ng-template>
    </nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/administradores/clientes">Clientes</a>
      <ng-template nz-tab>

        <app-administradores-clientes-table #clisTable></app-administradores-clientes-table>

      </ng-template>
    </nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/administradores/carga">Carga</a>
      <ng-template nz-tab>
        <app-administradores-form #admAdd [administradorId]="0" [crud]="'C'"></app-administradores-form>
      </ng-template>
    </nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/administradores/editar">Editar</a>
      <ng-template nz-tab>
        <app-administradores-form #admEdit [administradorId]="administradorId()" [crud]="'U'"></app-administradores-form>
      </ng-template>
    </nz-tab>
    <nz-tab>
      <a nz-tab-link routerLink="/ges/administradores/detalle">Detalle</a>
      <ng-template nz-tab>
        <app-administradores-form #admDetail [administradorId]="administradorId()" [crud]="'R'"></app-administradores-form>
      </ng-template>
    </nz-tab>

  </nz-tabs>
</nz-card>
