
<nz-card class="small-margin">

  @if (columnsResponsable().length) {
    <div nz-tab>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div class="izquierda">
          <shared-filtro-builder  [fieldsToSelect]="columnsResponsable()" [startFilters]="startFilters()" [(options)]="listOptions" />
        </div>
        <nz-button-group nz-button nzButtonGroup class="derecha">
          <!-- Recargar de grilla -->
          <button nz-button nzType="default" (click)="gridData.reload()" nz-tooltip nzTooltipTitle="{{ 'app.icon.reload' | i18n }}">
            <span nz-icon nzType="reload" nzTheme="outline"></span>
          </button>
          <button nz-button nzType="default" (click)="addNewItem()" nz-tooltip nzTooltipTitle="{{ 'app.icon.add' | i18n }}">
            <span nz-icon nzType="plus" nzTheme="outline"></span>
          </button>
          <button nz-button nzType="default" (click)="openDrawer()" nz-tooltip nzTooltipTitle="{{ 'app.icon.people' | i18n }}">
            <span nz-icon nzType="user" nzTheme="outline"></span>
          </button>
          <!-- <a nz-tooltip nzTooltipTitle="{{ 'app.icon.delete' | i18n }}">
          <button nz-button nzType="default" [disabled]=" GrupoActividadJerarquicoId().length == 0" (click)="deleteItemResponsable()"><span nz-icon nzType="delete" nzTheme="outline"></span></button>
        </a> -->
      </nz-button-group>
    </div>
    <div class="gridContainerGAR container-fluid">
      <angular-slickgrid gridId="gridEditGAR" [columns]="columnsResponsable()  | colsFilter" [options]="gridOptionsEdit"
        [dataset]="gridData.value()" (onAngularGridCreated)="angularGridReadyEdit($event)"
        (onSelectedRowsChanged)="handleSelectedRowsChanged($event)" (onCellChange)="onCellChanged($event)" (onBeforeEditCell)="handleOnBeforeEditCell($event)">
        <!-- (onBeforeEditCell)="onBeforeEditCell($event)" -->
      </angular-slickgrid>
    </div>
  </div>
}

</nz-card>
<app-detalle-persona [anio]="currPeriodo().anio" [mes]="currPeriodo().mes" [SucursalId]="0"
[PersonalId]="GrupoActividadJerarquicoPersonalId()" [visible]="visibleDrawerPersona()" (onClose)="closeDrawer()"></app-detalle-persona>
