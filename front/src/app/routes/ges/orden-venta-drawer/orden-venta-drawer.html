<nz-drawer [nzClosable]="true" [nzVisible]="visible()" [nzOffsetX]="0" [nzPlacement]="placement" [nzWidth]="900"
  [nzTitle]="titulo()" (nzOnClose)="visible.set(false)">
  <ng-container *nzDrawerContent>
    @if (visible()) {
      <app-orden-venta [anio]="anio()" [mes]="mes()" [objetivoId]="objetivoId()"
        (objetivoNombre)="objetivoNombre.set($event)" />
    }
  </ng-container>
</nz-drawer>
