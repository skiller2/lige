<nz-drawer [nzClosable]="true" [nzVisible]="visible()" [nzOffsetX]="0" [nzPlacement]="placement" [nzWidth]="1200"
  [nzTitle]="titulo()" (nzOnClose)="cerrar()">
  <ng-container *nzDrawerContent>
    @if (visible()) {
      <app-orden-venta-detalle [anio]="anio()" [mes]="mes()" [ClienteId]="ClienteId()" [ClienteElementoDependienteId]="ClienteElementoDependienteId()" 
        (objetivoNombre)="objetivoNombre.set($event)" (ordenVentaChange)="ordenVentaChange.emit($event)"
         />
    }
  </ng-container>
</nz-drawer>
