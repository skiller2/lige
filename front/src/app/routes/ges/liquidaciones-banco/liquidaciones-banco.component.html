<app-intercambio-bancos-modal [(isVisible)]="isVisibleIntercambio" [anio]="anio()" [mes]="mes()"
  [options]="tabIndex() === 2 ? listOptionsAyuda() : listOptions()" [tabIndex]="tabIndex() === 2 ? 2 : 1" (onCambio)="formChange$.next('')"></app-intercambio-bancos-modal>
<nz-card class="small-margin">
  <form nz-form #liquidacionesForm="ngForm">


    
  <div nz-row style="align-items: center; display: flex; justify-content: space-between;">
    <div nz-row nzSpan="12">
      <nz-form-label [nzSpan]="10">Periodo</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <nz-date-picker nzMode="month" name="periodo" ngModel (ngModelChange)="dateChange($event)" />
      </nz-form-control>

    </div>

    <ul nz-menu nzMode="horizontal">
      <li nz-menu-item nzMatchRouter>
            <span nz-icon nzType=""></span>
            <a [routerLink]="['/', 'ges', 'liquidacion_banco','listado']">Listado</a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <span nz-icon nzType=""></span>
            <a [routerLink]="['/', 'ges', 'liquidacion_banco','ayudaasistencial']">Adelanto/Ayuda</a>
          </li>

          <li nz-submenu nzTitle="Acciones">
            <ul style="width: auto !important">
              <li nz-menu-item (click)="isVisibleIntercambio.set(true)">
                <span nz-icon nzType="swap" nzTheme="outline"></span>Intercambio Bancos
              </li>
            </ul>

          </li>
          <li nz-menu-item (click)="exportGrid()">
            <span nz-icon nzType="download"></span>XLS
          </li>
          <li nz-menu-item nzMatchRouter>
            <a [routerLink]="['/', 'ges', 'liquidacion_banco','moviemientospendientes']">Movimientos Pendientes</a>
          </li>
    </ul>

    <nz-button-group nz-button nzButtonGroup>
      <button nz-button nzType="default" (click)="reloadGrid()"><span nz-icon
            nzType="reload" nzTheme="outline" nz-tooltip
            nzTooltipTitle="{{ 'app.icon.reload' | i18n }}"></span></button>

      </nz-button-group>
    </div>
    <nz-tabs nzCentered nzLinkRouter class="hide-ant-tabs-nav" [(nzSelectedIndex)]="tabIndex">
      <nz-tab></nz-tab>
      <nz-tab>
        <a nz-tab-link routerLink="/ges/liquidacion_banco/listado">Listado</a>
        @if (columns().length) {
          <ng-template nz-tab>
            <shared-filtro-builder  [fieldsToSelect]="columns()" [startFilters]="startFilters()" [(options)]="listOptions" />
            <div class="gridContainer1 container-fluid">
              <angular-slickgrid gridId="grid22" class="" [columns]="columns()"
                [options]="gridOptions" [dataset]="gridData.value()"
                (onAngularGridCreated)="angularGridReady($event)">
              </angular-slickgrid>
            </div>
          </ng-template>
        }
      </nz-tab>
      <nz-tab>
        <a nz-tab-link routerLink="/ges/liquidacion_banco/ayudaasistencial">Listado</a>
        @if ((columnsAyuda$|async); as columnasAyuda) {
          <ng-template nz-tab>
            <shared-filtro-builder  [fieldsToSelect]="columnasAyuda"
              [(options)]="listOptionsAyuda" />
              <div class="gridContainer2 container-fluid">
                <angular-slickgrid gridId="grid23" class="" [columns]="columnasAyuda"
                  [options]="gridOptionsAyuda" [dataset]="gridDataAyuda.value()"
                  (onAngularGridCreated)="angularGridReadyAyuda($event)">
                </angular-slickgrid>
              </div>
            </ng-template>
          }
        </nz-tab>

        <nz-tab>
          <a nz-tab-link routerLink="/ges/liquidacion_banco/moviemientospendientes">Movimientos Pendientes</a>
          <ng-template nz-tab>
            <movimientos-pendientes></movimientos-pendientes>
          </ng-template>
        </nz-tab>

      </nz-tabs>


    </form>
  </nz-card>
