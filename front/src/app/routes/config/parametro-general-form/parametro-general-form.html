<form (ngSubmit)="save()">

  <nz-form-item class="marginElement">
    <nz-form-label [nzXs]="24" [nzSm]="24" [nzMd]="3" nzRequired>Código</nz-form-label>
    <nz-form-control [nzXs]="24" [nzSm]="24" [nzMd]="8" sfErrorTip>
      <input nz-input [formField]="formParametroGeneral.ParametroGeneralCodigo" type="text" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item class="marginElement">
    <nz-form-label [nzXs]="24" [nzSm]="24" [nzMd]="3" nzRequired>Parámetros</nz-form-label>
    <nz-form-control [nzXs]="24" [nzSm]="24" [nzMd]="19" sfErrorTip>
      <textarea nz-input rows="12" [formField]="formParametroGeneral.Parametros"></textarea>
    </nz-form-control>
  </nz-form-item>

  @if (!soloLectura()) {
  <nz-form-item class="btn-margintop">
    <nz-form-control style="display: flex; justify-content: center; align-items: center; gap: 8px;">
      <button style="margin-right: 10px;" nzType="primary" nz-button type="submit"
        [nzLoading]="formParametroGeneral().submitting()"
        [disabled]="formParametroGeneral().submitting() || formParametroGeneral().dirty()==false || formParametroGeneral().valid()==false">
        {{ 'app.btn.save' | i18n }}
      </button>
      <button nz-button nzType="default" (click)="clearForm()" type="button">
        {{ 'app.btn.clear.form' | i18n }}
      </button>
    </nz-form-control>
  </nz-form-item>
  }

</form>
