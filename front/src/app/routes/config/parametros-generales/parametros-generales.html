<nz-card class="small-margin">
  <ng-template #extraTemplate>
      <nz-button-group nz-button nzButtonGroup>
        <!-- btn recarga: vuelve a leer la lista con los filtros aplicados -->
        <button nz-button nzType="default" (click)="refreshTick.update(n => n + 1)" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.reload' | i18n }}">
          <span nz-icon nzType="reload" nzTheme="outline"></span></button>
        <!-- btn alta: el routerLink va en el botón, envolverlo en un <a> lo saca del button-group -->
        <button nz-button nzType="default" [routerLink]="['/', 'config', 'parametros-generales', 'alta']" nz-tooltip
          nzTooltipTitle="{{ 'app.icon.add' | i18n }}" >
          <span nz-icon nzType="plus" nzTheme="outline"></span></button>
        <!-- btn baja: la confirmación la abre la solapa, no el click -->
        <button nz-button nzType="default" [disabled]="!parametrosSeleccionados() || parametrosSeleccionados().length !=1"
          nz-popconfirm nzPopconfirmTitle="Está seguro que quiere eliminar este Parámetro General?"
          (nzOnConfirm)="bajaParametroGeneral()" nz-tooltip nzTooltipTitle="{{ 'app.icon.delete' | i18n }}">
          <span nz-icon nzType="delete" nzTheme="outline"></span></button>
        <!-- btn modificar: abre un parámetro, así que no vale con varios tildados -->
        <button nz-button nzType="default" [disabled]="!parametrosSeleccionados() || parametrosSeleccionados().length !=1"
          nz-tooltip nzTooltipTitle="{{ 'app.icon.edit' | i18n }}" [routerLink]="['/', 'config', 'parametros-generales', 'editar']">
          <span nz-icon nzType="edit" nzTheme="outline"></span></button>
        <!-- btn consulta -->
        <button nz-button nzType="default" [disabled]="!parametrosSeleccionados() || parametrosSeleccionados().length !=1"
          nz-tooltip nzTooltipTitle="{{ 'app.icon.consult' | i18n }}" [routerLink]="['/', 'config', 'parametros-generales', 'detalle']">
          <span nz-icon nzType="info-circle" nzTheme="outline"></span></button>
      </nz-button-group>
  </ng-template>

  <nz-tabs nzLinkRouter [nzTabBarExtraContent]="extraTemplate">
    <nz-tab><a *nzTabLink nz-tab-link [routerLink]="['/', 'config', 'parametros-generales', 'listado']">Listado</a>
      <app-table-parametro-general #tableParametroGeneral [(parametrosSeleccionados)]="parametrosSeleccionados" [refreshGrid]="refreshTick()" />
    </nz-tab>

    <nz-tab [nzDisabled]="!router.isActive('/config/parametros-generales/detalle',{})" >
      <a *nzTabLink nz-tab-link [routerLink]="['/', 'config', 'parametros-generales', 'detalle']" >Detalle</a>
      @if (router.isActive('/config/parametros-generales/detalle',{})){
      <app-parametro-general-form [soloLectura]="true"
        [ParametroGeneralCodigo]="this.parametrosSeleccionados()[0] ?? ''" />
      }
    </nz-tab>

    <nz-tab [nzDisabled]="!router.isActive('/config/parametros-generales/alta',{})"><a *nzTabLink nz-tab-link [routerLink]="['/', 'config', 'parametros-generales', 'alta']">Alta</a>
      @if (router.isActive('/config/parametros-generales/alta',{})){
      <app-parametro-general-form [soloLectura]="false" [ParametroGeneralCodigo]="''"
        (parametroGeneralGuardado)="parametroGeneralAlta($event)" />
      }
    </nz-tab>

    <nz-tab [nzDisabled]="!router.isActive('/config/parametros-generales/editar',{})"><a *nzTabLink nz-tab-link [routerLink]="['/', 'config', 'parametros-generales', 'editar']">Editar</a>
      @if (router.isActive('/config/parametros-generales/editar',{})){

      <app-parametro-general-form [soloLectura]="false"
        [ParametroGeneralCodigo]="this.parametrosSeleccionados()[0] ?? ''" (parametroGeneralGuardado)="parametroGeneralGuardado()" />
      }
    </nz-tab>

  </nz-tabs>

</nz-card>
